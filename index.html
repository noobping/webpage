
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="noobping">
  <title>noobping</title>

  <style>
    :root {
      color-scheme: light;
      background: #fff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        background: #111;
      }
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
    }

    img {
      display: block;
      max-width: 100vw;
      max-height: 100svh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img src="lego.png" alt="LEGO Boba Fett figure">
</body>
</html>
